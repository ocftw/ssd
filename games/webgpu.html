<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>WebGPU 試作 · 資安防護新手村</title>
  <style>
    :root { --ink:#22252b; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #aac3d8; }
    canvas { display: block; }
    #hud {
      position: fixed; left: 12px; top: 12px; z-index: 10; max-width: min(86vw, 380px);
      background: rgba(251,247,239,.94); color: var(--ink); border-radius: 12px; padding: 11px 13px;
      box-shadow: 0 6px 22px rgba(0,0,0,.18); font: 13px/1.6 -apple-system, "Noto Sans TC", system-ui, sans-serif;
    }
    #hud h1 { margin: 0 0 4px; font-size: 14px; }
    #hud .row { display: flex; gap: 6px; align-items: baseline; }
    #hud .k { color: #6b7280; }
    #backend { font-weight: 800; }
    #backend.gpu { color: #1d8a4e; }
    #backend.gl  { color: #b1773f; }
    #backend.err { color: #c0433a; }
    #fps { font-weight: 800; font-variant-numeric: tabular-nums; }
    #hud .hint { margin-top: 7px; color: #6b7280; font-size: 11.5px; }
    #hud a { color: #1d6fb8; font-weight: 700; text-decoration: none; }
    #hud code { background: rgba(0,0,0,.06); border-radius: 5px; padding: 1px 5px; font-size: 11px; }
    #controls { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    #controls a { background: rgba(0,0,0,.06); border-radius: 7px; padding: 4px 9px; font-size: 11.5px; }
    #controls a.on { background: #1d6fb8; color: #fff; }
    #fps { font-weight: 800; font-variant-numeric: tabular-nums; }
    #framems { font-size: 11px; }
    #draws, #tris, #objs { font-weight: 700; font-variant-numeric: tabular-nums; }
  </style>
  <script type="importmap">
  { "imports": {
      "three": "./vendor/three.webgpu.min.js",
      "three/webgpu": "./vendor/three.webgpu.min.js",
      "three/tsl": "./vendor/three.tsl.min.js",
      "three/addons/": "./vendor/jsm/"
  } }
  </script>
</head>
<body>
  <div id="hud">
    <h1>🧪 WebGPU 試作</h1>
    <div class="row"><span class="k">使用中後端：</span><span id="backend">偵測中…</span></div>
    <div class="row"><span class="k">FPS：</span><span id="fps">—</span><span class="k" id="framems"></span></div>
    <div class="row"><span class="k">Draw：</span><span id="draws">—</span><span class="k">　△</span><span id="tris">—</span><span class="k">　物件</span><span id="objs">—</span></div>
    <div class="row"><span class="k">壓力等級：</span><span id="stresslv">0</span><span class="k">　繪製：</span><span id="drawmode">—</span></div>
    <div id="controls"></div>
    <div class="hint">
      自動選用 WebGPU；不支援時自動退回 WebGL2。FPS 受螢幕更新率上限影響——<b>提高壓力等級壓到 60 以下</b>，兩後端的差距才看得出來。<br>
      此為評估頁，與正式遊戲完全獨立。
    </div>
  </div>
  <script type="module" src="./webgpu.js"></script>
</body>
</html>
