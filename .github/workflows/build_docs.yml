name: Build Docs
on:
  push:
    branches:
      - shield
  workflow_dispatch:
permissions:
  contents: write
  pages: read      # 讀 Pages 建置狀態，等它發佈完成再清 Cloudflare 快取
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Configure Git Credentials
        run: |
          git config user.name ocf-ssd[bot]
          git config user.email ssd+bot@ocf.tw
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Cache uv
        uses: actions/cache@v5
        with:
          path: ~/.local/share/uv/cache
          key: uv-cache-${{ hashFiles('**/uv.lock') }}
      - name: Cache venv
        uses: actions/cache@v5
        with:
          path: ./.venv
          key: uv-venv-${{ hashFiles('**/uv.lock') }}
      - name: Install imaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev
      - name: Install dependencies
        run: uv sync
      - name: Build and Deploy Docs
        run: uv run mkdocs gh-deploy --force
      # gh-deploy 只是把檔案推上 gh-pages 分支；GitHub Pages 接著才建置發佈，實測約 40 秒。
      # 不等它就清 Cloudflare 快取，清完的第一個請求會回源抓到「還沒換上的舊版」再快取一次，等於白清：
      # 2026-08-11 那次就是清快取 16:35:40、Pages 實際完成 16:36:22，之後 10 分鐘內都可能拿到舊的 index.html。
      - name: Wait for GitHub Pages to publish
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          target=$(git rev-parse gh-pages 2>/dev/null || git rev-parse origin/gh-pages 2>/dev/null || echo "")
          if [ -z "${target}" ]; then
            echo "::warning::找不到 gh-pages 的 commit，略過等待"
            exit 0
          fi
          echo "等待 GitHub Pages 發佈 ${target}"
          for i in $(seq 1 60); do
            latest=$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" --jq '.status + " " + .commit' 2>/dev/null || echo "unknown none")
            status="${latest%% *}"; commit="${latest##* }"
            if [ "${status}" = "built" ] && [ "${commit}" = "${target}" ]; then
              echo "✅ Pages 已發佈 ${commit}（等了 $((i * 5))s）"
              exit 0
            fi
            sleep 5
          done
          # 逾時不讓整個部署失敗：檔案其實已經推上去了，只是快取可能清得太早
          echo "::warning::等 GitHub Pages 發佈逾時（5 分鐘），仍繼續清快取；若線上仍是舊版，10 分鐘後 index.html 快取自然過期"

      - name: Purge Cloudflare cache (ssd.ocf.tw)
        if: success()
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_NAME: ocf.tw
          CF_PURGE_HOST: ssd.ocf.tw
        run: |
          set -euo pipefail
          if [ -z "${CF_API_TOKEN}" ]; then
            echo "::notice::未設定 CLOUDFLARE_API_TOKEN，略過 Cloudflare 快取清除"
            exit 0
          fi
          # 以 token 自動查出 zone id，毋須另外提供 ocf.tw 的 zone id
          zone_id=$(curl -fsS \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones?name=${CF_ZONE_NAME}&status=active" \
            | jq -r '.result[0].id // empty')
          if [ -z "${zone_id}" ]; then
            echo "::error::找不到 ${CF_ZONE_NAME} zone；請確認 API token 具備 Zone:Read 權限且涵蓋 ${CF_ZONE_NAME}"
            exit 1
          fi
          echo "Zone ${CF_ZONE_NAME} -> ${zone_id}"
          # 僅清除 ssd.ocf.tw 這個 hostname 的快取，不影響 ocf.tw 其他子網域
          resp=$(curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"hosts\":[\"${CF_PURGE_HOST}\"]}")
          if [ "$(echo "${resp}" | jq -r '.success')" != "true" ]; then
            echo "::error::Cloudflare 快取清除失敗：${resp}"
            exit 1
          fi
          echo "✅ 已清除 ${CF_PURGE_HOST} 的 Cloudflare 快取"
