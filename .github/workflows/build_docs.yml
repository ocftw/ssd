name: Build Docs
on:
  push:
    branches:
      - shield
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Configure Git Credentials
        run: |
          git config user.name ocf-ssd[bot]
          git config user.email ssd+bot@ocf.tw
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Cache uv
        uses: actions/cache@v5
        with:
          path: ~/.local/share/uv/cache
          key: uv-cache-${{ hashFiles('**/uv.lock') }}
      - name: Cache venv
        uses: actions/cache@v5
        with:
          path: ./.venv
          key: uv-venv-${{ hashFiles('**/uv.lock') }}
      - name: Install imaging dependencies
        run: sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev
      - name: Install dependencies
        run: uv sync
      - name: Build and Deploy Docs
        run: uv run mkdocs gh-deploy --force
